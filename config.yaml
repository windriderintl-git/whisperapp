hotkey:
  modifiers:
  - ctrl
  - windows
  hold_threshold_ms: 350
  double_tap_window_ms: 1200
  debug: true
whisper:
  model: small.en
  device: auto
  compute_type: auto
  beam_size: 1
  vad_filter: true
  vad_min_silence_ms: 500
  condition_on_previous_text: false
audio:
  sample_rate: 16000
  silence_threshold: 0.015
  silence_duration_s: 1.5
  min_chunk_duration_s: 0.5
llm:
  enabled: true
  polish_intensity: standard
  backend: ollama
  model: qwen2.5:3b
  host: http://localhost:11434
  timeout_s: 8.0
  warmup_on_start: true
  keep_alive: 30m
  skip_below_words: 4
context:
  enabled: true
  override: null
output:
  mode: type
  trailing_space: true
  restore_clipboard: true
  restore_delay_ms: 300
edit_mode:
  enabled: true
  modifiers:
  - ctrl
  - alt
  hold_threshold_ms: 350
commands:
  enabled: true
snippets:
  enabled: true
ui:
  overlay: true
  overlay_position: bottom
vocabulary: {}
